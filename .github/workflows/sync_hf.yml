name: Sincronizar con Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publicar en Hugging Face Space
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: David5421Agr/SenaSCOR
          repo_type: space
          space_sdk: static
          hf_token: ${{ secrets.HF_TOKEN }}
